    <div id="bukutamu" align="center">
        <table width="85%" border="0" cellpadding="0" cellspacing="0">
            <tr>
                <td>
                    <font face="Arial">
                        <h2><font color="#38bdf8">✍️ Buku Tamu</font></h2>
                        <p><font color="#94a3b8" size="2">Tinggalkan pesan, kesan, atau saran kamu di bawah ini:</font></p>
                        <hr color="#38bdf8" size="1">
                        <br>

                        <table width="100%" cellpadding="25" bgcolor="#152238" border="0">
                            <tr>
                                <td>
                                    <form>
                                        <table cellpadding="12" border="0" width="100%">
                                            <tr>
                                                <td width="25%"><font color="#ffffff"><b>Nama:</b></font></td>
                                                <td><input type="text" name="nama" size="35" placeholder="Tulis nama lengkap..."></td>
                                            </tr>
                                            <tr>
                                                <td><font color="#ffffff"><b>Jenis Kelamin:</b></font></td>
                                                <td>
                                                    <font color="#cbd5e1">
                                                        <input type="radio" name="jk" value="Laki-laki" id="l"><label for="l"> Laki-laki</label> &nbsp;&nbsp;&nbsp;&nbsp;
                                                        <input type="radio" name="jk" value="Perempuan" id="p"><label for="p"> Perempuan</label>
                                                    </font>
                                                </td>
                                            </tr>
                                            <tr>
                                                <td valign="top"><font color="#ffffff"><b>Pesan:</b></font></td>
                                                <td><textarea name="pesan" rows="5" cols="38" placeholder="Tulis pesan kamu di sini..."></textarea></td>
                                            </tr>
                                            <tr>
                                                <td></td>
                                                <td>
                                                    <br>
                                                    <table border="0" cellpadding="8" bgcolor="#38bdf8">
                                                        <tr>
                                                            <td>
                                                                <input type="submit" value="Kirim Pesan" style="background:transparent; border:none; color:#0a1120; font-weight:bold; cursor:pointer; font-size:14px;">
                                                            </td>
                                                        </tr>
                                                    </table>
                                                </td>
                                            </tr>
                                        </table>
                                    </form>
                                </td>
                            </tr>
                        </table>
